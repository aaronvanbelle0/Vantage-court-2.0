<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="NW Sport Courts">
  <title>NW Sport Courts — Favicon</title>
  <!--
    FAVICON VARIANT — simplified for legibility at 16px.
    Service lines removed and strokes thickened to 10/120 so the court glyph
    stays readable when the whole icon is 16 device pixels wide.
  -->
  <circle cx="60" cy="60" r="60" fill="#1F5FA6"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square">
    <rect x="25" y="35" width="70" height="50"/>
    <line x1="60" y1="35" x2="60" y2="85"/>
  </g>
</svg>
