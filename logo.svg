<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" role="img" aria-label="North West Sport Courts">
  <title>North West Sport Courts — Reversed (White) Logo, for dark backgrounds</title>
  <style>
    .wm  { font-family: 'Barlow Condensed', 'Oswald', 'Arial Narrow', sans-serif; font-weight: 700; fill: #FFFFFF; letter-spacing: 3px; }
    .tag { font-family: 'Barlow Condensed', 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; fill: #FFFFFF; fill-opacity: .72; letter-spacing: 5.2px; }
  </style>

  <!-- Mark: white ring, knocked-out court -->
  <circle cx="60" cy="60" r="57" fill="none" stroke="#FFFFFF" stroke-width="6"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="square">
    <rect x="26" y="36" width="68" height="48"/>
    <line x1="60" y1="36" x2="60" y2="84"/>
  </g>

  <text class="wm" x="150" y="52" font-size="38">NORTH WEST</text>
  <text class="wm" x="150" y="88" font-size="38">SPORT COURTS</text>

  <rect x="150" y="99" width="34" height="3" fill="#FFFFFF"/>
  <text class="tag" x="192" y="103" font-size="11">CONSTRUCTION &amp; RESURFACING</text>
</svg>
